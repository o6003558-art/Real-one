<!doctype html>
<html lang="en">
  <head>
    <title>Omar Kh</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta
      name="description"
      content="Welcome ,I made this website to help you develop your English , My regards OMAR KHALED . "
    />

    <meta name="keywords" content="English" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="O2 website" />
    <meta
      property="og:description"
      content="My website contains pdf files used in explanation"
    />

  </head>

  <body>
    <div id="user-controls" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
    <button id="auth-btn" class="btn-login">تسجيل دخول</button>
    <button id="profile-btn" style="display: none;" class="btn-signup">تعديل الاسم</button>
</div>

<div id="auth-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModals()">&times;</span>
        <h3>تسجيل دخول / حساب جديد</h3>
        <input type="email" id="email-input" placeholder="البريد الإلكتروني">
        <input type="password" id="password-input" placeholder="كلمة المرور">
        <button onclick="handleAuth('login')" class="btn-login">دخول</button>
        <button onclick="handleAuth('signup')" class="btn-signup">حساب جديد</button>
    </div>
</div>

<div id="profile-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModals()">&times;</span>
        <h3>تغيير اسم المستخدم</h3>
        <p style="font-size: 12px; color: gray;">يمكنك التغيير مرة واحدة كل 24 ساعة</p>
        <input type="text" id="username-input" placeholder="اكتب اسمك الجديد...">
        <button id="save-username-btn" class="btn-login">حفظ الاسم</button>
    </div>
</div>

<div id="input-area" style="display: none;">
    <input type="text" id="message-input" placeholder="اكتب رسالة...">
    <button id="send-btn">إرسال</button>
</div>
<div id="login-notice" style="text-align: center; padding: 10px; color: white;">
    يجب <a href="#" onclick="openAuthModal()" style="color: #ff9800;">تسجيل الدخول</a> لتتمكن من إرسال رسائل.
</div>

          
   <script type="module" src="script.js" >
  </body>
</html>
