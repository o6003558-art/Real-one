<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات عمر الاحترافي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="user-controls" style="position: fixed; top: 10px; left: 10px; z-index: 1000;">
        <button id="auth-btn" class="btn-login" onclick="openAuthModal()">تسجيل دخول</button>
        <button id="profile-btn" class="btn-signup" style="display: none;">تعديل الاسم</button>
    </div>

    <div id="chat-box">
        </div>

    <div id="input-area" style="display: none;">
        <input type="text" id="message-input" placeholder="اكتب رسالتك هنا...">
        <button id="send-btn" onclick="sendMessage()">إرسال</button>
    </div>



    
    <div id="login-notice" style="position: fixed; bottom: 20px; width: 100%; text-align: center; color: white;">
        يجب <a href="#" onclick="openAuthModal()" style="color: #ff9800; font-weight: bold;">تسجيل الدخول</a> عشان تقدر تبعت رسايل.
    </div>

    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModals()">&times;</span>
            <h3>تسجيل دخول / حساب جديد</h3>
            <input type="email" id="email-input" placeholder="البريد الإلكتروني">
            <input type="password" id="password-input" placeholder="كلمة المرور">
            <button onclick="handleAuth('login')" class="btn-login">دخول</button>
            <button onclick="handleAuth('signup')" class="btn-signup">إنشاء حساب جديد</button>
        </div>
    </div>

    <div id="profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModals()">&times;</span>
            <h3>تغيير اسم المستخدم</h3>
            <p style="font-size: 11px; color: #aaa;">تقدر تغير اسمك مرة واحدة كل 24 ساعة</p>
            <input type="text" id="username-input" placeholder="اكتب اسمك الجديد...">
            <button id="save-username-btn" class="btn-login">حفظ الاسم</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
